name: CI

# PR-only gate: type-check + test + build, no publish. Push-to-main correctness
# is covered by dev.yml (single build per push). Pipeline body in _build.yml.
on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  check:
    uses: ./.github/workflows/_build.yml
    secrets: inherit
